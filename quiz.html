function options(q){return state.lang==="en"?q.oe:q.on}
function saveCoins(){gameProgress.coins=state.coins;gameProgress.bestStreak=state.best;persistGame()}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2300)}
function updateStats(){
 $("coins").textContent=state.coins;$("streak").textContent=state.streak;$("bestStreak").textContent=state.best;
 $("score").textContent=(state.answers.size?Math.round(state.correct/state.answers.size*100):0)+"%";
 $("count").textContent=tr(gameProgress.totalAnswered+" total • "+gameProgress.totalCorrect+" correct",gameProgress.totalAnswered+" जम्मा • "+gameProgress.totalCorrect+" सही");
 $("streakBar").style.width=Math.min(state.streak,10)*10+"%";
}
function buildFilters(){
 categories.forEach(c=>{const op=document.createElement("option");op.value=c;op.textContent=c;$("filter").append(op)});
}
function buildList(){
 const query=state.query.trim().toLowerCase();
 state.list=bank.map((q,i)=>i).filter(i=>{
  const q=bank[i], text=(q.en+" "+q.ne+" "+q.cat).toLowerCase();
  return (state.cat==="all"||q.cat===state.cat)&&(!query||text.includes(query))&&
   (state.mode==="all"||(state.mode==="new"&&!state.answers.has(i))||(state.mode==="wrong"&&state.wrong.has(i)));
 });
 if(requestedCourse)state.list=state.list.filter(i=>bank[i].cat.toLowerCase()===requestedCourse.toLowerCase());
 if(dailyMode){
  const seed=Number(todayKey.replaceAll("-",""));const pool=bank.map((q,i)=>i);
  for(let i=pool.length-1;i>0;i--){const j=(seed+i*17)%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}
  state.list=pool.slice(0,10);
 }
 state.pos=0;renderQuestion();
}
function renderQuestion(){
 const total=state.list.length;
 $("answers").innerHTML="";
 if(!total){
  $("tag").textContent=tr("No course selected","विषय भेटिएन");
  $("counter").textContent="0 / 0";
  $("question").textContent=tr("No questions match. Change your course or search.","प्रश्न भेटिएन। विषय वा खोज परिवर्तन गर्नुहोस्।");
  $("feedback").textContent=tr("Choose another course or clear the search.","अर्को विषय छान्नुहोस् वा खोज हटाउनुहोस्।");
  $("progress").style.width="0%";$("next").disabled=true;$("hint").disabled=true;updateStats();return;
 }
 const id=state.list[state.pos],q=bank[id],opts=options(q),answered=state.answers.has(id);
 $("tag").textContent=q.cat;$("counter").textContent=tr("Question","प्रश्न")+" "+(state.pos+1)+" / "+total;
 $("progress").style.width=((state.pos+1)/total*100)+"%";
 $("question").textContent=(state.pos+1)+". "+tr(q.en,q.ne);
 opts.forEach((txt,i)=>{
  const b=document.createElement("button");b.type="button";b.className="answer";
  const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+i);
  const label=document.createElement("span");label.textContent=txt;b.append(letter,label);
  if(state.eliminated.get(id)?.has(i))b.hidden=true;
  if(answered){b.disabled=true;if(i===q.a)b.classList.add("correct");if(state.answers.get(id)===i&&i!==q.a)b.classList.add("wrong")}
  else b.addEventListener("click",()=>selectAnswer(id,i));
  $("answers").append(b);
 });
 $("feedback").className="feedback"+(answered?(state.answers.get(id)===q.a?" good":" bad"):"");
 $("feedback").textContent=answered?(state.answers.get(id)===q.a?tr("Correct answer. Well done!","सही उत्तर! उत्कृष्ट।"):tr("Correct answer: ","सही उत्तर: ")+opts[q.a]):tr("Choose the best answer.","सबैभन्दा सही उत्तर छान्नुहोस्।");
 $("next").disabled=!answered;$("hint").disabled=answered||state.hinted.has(id)||state.coins<2;
 $("next").textContent=state.pos===total-1?tr("Finish set","समूह समाप्त"):tr("Next question →","अर्को प्रश्न →");
 updateStats();
}
function selectAnswer(id,index){
 if(state.answers.has(id))return;
 state.answers.set(id,index);
 const q=bank[id],isCorrect=index===q.a;
 gameProgress.totalAnswered++;gameProgress.lastActiveDate=todayKey;
 const stat=gameProgress.subjectStats[q.cat]||{answered:0,correct:0};
 stat.answered++;if(isCorrect)stat.correct++;gameProgress.subjectStats[q.cat]=stat;
 gameProgress.history.unshift({subject:q.cat,question:q.en.slice(0,105),correct:isCorrect,date:todayKey});
 gameProgress.history=gameProgress.history.slice(0,12);
 if(isCorrect){
  state.correct++;gameProgress.totalCorrect++;gameProgress.xp+=10;state.coins++;state.streak++;
  if(state.streak===5){state.coins+=3;toast(tr("5 correct in a row! +3 bonus coins","लगातार ५ सही! +३ बोनस कोइन"))}
  if(state.streak===10){state.coins+=10;state.streak=0;toast(tr("10 streak! +10 bonus coins!","लगातार १० सही! +१० बोनस कोइन"))}
  state.best=Math.max(state.best,state.streak);
 }else{gameProgress.xp+=2;state.wrong.add(id);state.streak=0}
 persistGame();saveCoins();renderQuestion();
}
function useHint(){
 const id=state.list[state.pos];if(id===undefined||state.answers.has(id)||state.hinted.has(id))return;
 if(state.coins<2){toast(tr("You need 2 coins for a 50:50 hint.","५०:५० संकेतका लागि २ कोइन चाहिन्छ।"));return}
 const wrong=bank[id].oe.map((_,i)=>i).filter(i=>i!==bank[id].a);
 wrong.sort(()=>Math.random()-.5);state.eliminated.set(id,new Set(wrong.slice(0,2)));
 state.hinted.add(id);state.coins-=2;saveCoins();toast(tr("Two incorrect options removed!","दुई गलत विकल्प हटाइयो!"));renderQuestion();
}
function advance(){
 if(state.pos<state.list.length-1){state.pos++;renderQuestion()}
 else{
  if(state.answers.size===state.list.length){
   gameProgress.quizzesCompleted++;
   if(dailyMode&&!gameProgress.dailyDays.includes(todayKey)){gameProgress.dailyDays.push(todayKey);gameProgress.xp+=25;state.coins+=5;saveCoins();toast(tr("Daily challenge complete! +25 XP and +5 coins","डेली च्यालेन्ज पूरा! +२५ XP र +५ कोइन"))}
   else toast(tr("Quiz completed! Progress saved.","क्विज पूरा भयो! प्रगति सुरक्षित भयो।"));
   persistGame();
  }else toast(tr("Answer every question to complete this challenge.","च्यालेन्ज पूरा गर्न सबै प्रश्नको उत्तर दिनुहोस्।"));
  $("next").disabled=true;
 }
}
function shuffleQuestions(){for(let i=state.list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.list[i],state.list[j]]=[state.list[j],state.list[i]]}state.pos=0;renderQuestion()}
function setLanguage(){
 state.lang=state.lang==="en"?"ne":"en";$("lang").textContent=state.lang==="en"?"नेपाली":"English";
 $("search").placeholder=tr("Search questions or topics…","प्रश्न वा विषय खोज्नुहोस्…");
 $("skip").textContent=tr("Skip","छोड्नुहोस्");$("shuffle").textContent=tr("Shuffle","मिसाउनुहोस्");
 $("hint").textContent=tr("🪙 2 · 50:50 Hint","🪙 २ · ५०:५० संकेत");
 $("mode").options[0].text=tr("All questions","सबै प्रश्न");$("mode").options[1].text=tr("Unanswered","उत्तर नदिएका");$("mode").options[2].text=tr("Review mistakes","गल्ती दोहोर्‍याउनुहोस्");
 $("filter").options[0].text=tr("All courses","सबै विषय");renderQuestion();
}
function showError(err){
 $("question").textContent="Quiz could not load";
 $("answers").innerHTML="";$("feedback").textContent="Please refresh the page. "+String(err);
}
try{
 buildFilters();
 $("lang").addEventListener("click",setLanguage);
 $("filter").addEventListener("change",e=>{state.cat=e.target.value;buildList()});
 $("mode").addEventListener("change",e=>{state.mode=e.target.value;buildList()});
 $("search").addEventListener("input",e=>{state.query=e.target.value;buildList()});
 $("next").addEventListener("click",advance);
 $("skip").addEventListener("click",advance);
 $("shuffle").addEventListener("click",shuffleQuestions);
 $("hint").addEventListener("click",useHint);
 buildList();
}catch(err){showError(err);console.error(err)}
</script>

 #nf-mobile-bottom a.nf-active .nf-label{font-weight:800}
}

(()=>{if(document.getElementById('nf-mobile-bottom'))return;const p=decodeURIComponent(location.pathname).toLowerCase();const nested=p.includes('/learn study/');const prefix=nested?'../':'';const items=[{id:'home',icon:'🏠',label:'Home',href:prefix+'index.html'},{id:'computer',icon:'💻',label:'Computer',href:prefix+'Code%20Study.html'},{id:'dashboard',icon:'📊',label:'Dashboard',href:prefix+'dashboard.html'},{id:'study',icon:'📚',label:'Study',href:prefix+'Learn%20Study/index.html'},{id:'quiz',icon:'🧠',label:'Quiz',href:prefix+'quiz.html'}];let active='home';if(p.endsWith('/dashboard.html'))active='dashboard';else if(p.endsWith('/code study.html'))active='computer';else if(p.endsWith('/quiz.html'))active='quiz';else if(nested||/periodic table|gpa|question-bank|virtual-lab|ai-learning/.test(p))active='study';const nav=document.createElement('nav');nav.id='nf-mobile-bottom';nav.setAttribute('aria-label','Mobile navigation');nav.innerHTML=items.map(x=>'<a href="'+x.href+'" data-section="'+x.id+'" class="'+(x.id===active?'nf-active':'')+'" '+(x.id===active?'aria-current="page"':'')+'><span class="nf-icon" aria-hidden="true">'+x.icon+'</span><span class="nf-label">'+x.label+'</span></a>').join('');document.body.appendChild(nav)})();
</script>
