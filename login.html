<title>NovaFacts | Google Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background:
        linear-gradient(
            rgba(35, 5, 80, .20),
            rgba(35, 5, 80, .35)
        ),
        url("logo2.png")
        center center / cover no-repeat fixed;
}


/* STARRY SKY */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 80px 90px, #fff, transparent),
        radial-gradient(2px 2px at 140px 50px, #fff, transparent),
        radial-gradient(1px 1px at 200px 120px, #fff, transparent),
        radial-gradient(2px 2px at 260px 40px, #fff, transparent),
        radial-gradient(1px 1px at 320px 100px, #fff, transparent);

    background-size: 350px 180px;
    opacity: .85;
}

/* MOON LIGHT */
.sky-glow {
    position: fixed;
    width: 600px;
    height: 400px;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(
        ellipse,
        rgba(255, 170, 255, .3),
        transparent 70%
    );
    z-index: 0;
}

/* LOGIN CARD */
.card {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 390px;
    padding: 20px;
    text-align: center;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 7px;

    background: rgba(112, 40, 177, .27);

    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);

    box-shadow: 0 15px 40px rgba(30, 0, 75, .25);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: white;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px #6c24a8;
}

h1 {
    font-size: 22px;
    margin-bottom: 12px;
}

.description {
    font-size: 12px;
    color: #f0dcff;
    line-height: 1.6;
    margin-bottom: 22px;
}

/* GOOGLE BUTTON */
.google-btn {
    width: 100%;
    min-height: 43px;
    padding: 11px 15px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;

    border: 1px solid rgba(255,255,255,.5);
    border-radius: 30px;

    background: white;
    color: #222;

    font-size: 13px;
    font-weight: bold;
    cursor: pointer;

    transition: .3s;
}

.google-btn:hover {
    background: #eee4ff;
    transform: translateY(-2px);
}

.google-btn:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

.google-icon {
    width: 18px;
    height: 18px;
}

#status {
    margin-top: 17px;
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    color: white;
}

.footer {
    margin-top: 20px;
    font-size: 11px;
    color: #f0dcff;
}

.footer a {
    color: white;
    font-weight: bold;
    text-decoration: none;
}

/* ADVERTISEMENT */
.nova-ad {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 390px;
    margin-top: 20px;
    padding: 10px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;
    background: rgba(45, 12, 86, .45);
    text-align: center;
}

.nova-ad-label {
    color: #e5d3f7;
    font-size: 9px;
    letter-spacing: 2px;
    text-align: right;
}

.nova-ad h3 {
    color: #ffe39a;
    font-size: 14px;
    margin: 8px 0;
}

.nova-ad p {
    font-size: 11px;
    color: #eee0ff;
}

.nova-ad a {
    display: inline-block;
    margin-top: 9px;
    padding: 8px 18px;
    background: #e5bd58;
    color: #251344;
    text-decoration: none;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

/* PAGE LAYOUT */
.page-content {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 390px;
}

/* MOBILE */
@media(max-width: 480px) {
    body {
        padding: 18px;
        background:
            linear-gradient(
                rgba(35, 5, 80, .20),
                rgba(35, 5, 80, .35)
            ),
            url("logo1.png")
            center center / cover no-repeat fixed;
    }

    .card {
        padding: 22px 18px;
    }

    .logo {
        font-size: 24px;
    }

    .mountains {
        height: 48%;
    }

    .forest {
        height: 30%;
    }
}
.logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    font-weight: 800;
    color: white;
    margin-bottom: 8px;
}

.logo img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}


/* SUBTLE BACKGROUND AND CARD ANIMATIONS */
body {
    background-size: cover;
    animation: backgroundBreath 24s ease-in-out infinite alternate;
}

@keyframes backgroundBreath {
    from { background-position: center center; }
    to   { background-position: center 56%; }
}

.stars {
    animation: starsTwinkle 5s ease-in-out infinite alternate;
}

@keyframes starsTwinkle {
    from { opacity: .35; }
    to   { opacity: .85; }
}

.sky-glow {
    animation: glowPulse 8s ease-in-out infinite alternate;
}

@keyframes glowPulse {
    from { opacity: .45; transform: translateX(-50%) scale(.92); }
    to   { opacity: .95; transform: translateX(-50%) scale(1.08); }
}

.page-content {
    animation: pageAppear .9s ease-out both;
}

@keyframes pageAppear {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}

.card {
    animation: cardFloat 7s ease-in-out 1s infinite;
}

@keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
}

.google-btn {
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
}

.google-btn:hover {
    box-shadow: 0 8px 24px rgba(255,255,255,.22);
}

.nova-ad {
    animation: adAppear 1s ease-out .25s both;
}

@keyframes adAppear {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    body, .stars, .sky-glow, .page-content, .card, .nova-ad {
        animation: none !important;
    }
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<!-- FIREBASE GOOGLE LOGIN -->
<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyAhIvLbAsi7M-TOTBix5q8ihoJ64M_1QU0",
    authDomain: "lcci-6c2a3.firebaseapp.com",
    projectId: "lcci-6c2a3",
    storageBucket: "lcci-6c2a3.firebasestorage.app",
    messagingSenderId: "486309279972",
    appId: "1:486309279972:web:bac73946ce8993a41194f1",
    measurementId: "G-7N85D4CBHY"
};


// GOOGLE SHEETS WEB APP URL

const SHEET_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwTsD9awwQ2bod0EgDdZHs6NGLhNnw_kQ_soWAb5NrVrpXGCWxoRVI_fx-a8NyB7AnHiA/exec";


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


// HTML ELEMENTS

const button = document.getElementById("googleBtn");
const status = document.getElementById("status");


// GOOGLE LOGIN

button.addEventListener("click", async () => {

    button.disabled = true;
    status.textContent = "Connecting to Google...";

    try {

        const result = await signInWithPopup(auth, provider);

        const idToken = await result.user.getIdToken();

        status.textContent = "Sending information to Google Sheets...";

        const response = await fetch(SHEET_WEB_APP_URL, {

            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
                action: "logLogin",
                idToken: idToken
            }),

            redirect: "follow"

        });

        if (!response.ok) {
            throw new Error("Google Sheets connection failed.");
        }

        const resultData = await response.json();

        if (!resultData.success) {
            throw new Error(
                resultData.error || "Could not save login information."
            );
        }

        status.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    } catch (error) {

        console.error("Login Error:", error);

        status.textContent = "Error: " + error.message;

        button.disabled = false;

    }

});

</script>
