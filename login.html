<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><meta name="description" content="Sign in to NovaFacts with your Google account."><link rel="icon" href="favicon.png"><title>Sign in | NovaFacts</title>
<style>
:root{--bg:#101114;--surface:#191a1f;--surface2:#22242a;--text:#f5f5f5;--muted:#a6a8b0;--border:rgba(255,255,255,.12);--accent:#e6b84c}
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:22px;background:var(--bg);color:var(--text);font:16px/1.6 Arial,Helvetica,sans-serif;display:grid;place-items:center}
main{width:min(100%,440px)}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:clamp(24px,6vw,38px);text-align:center;box-shadow:0 18px 55px #0005}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:25px;font-weight:800;margin-bottom:24px}.brand img{width:38px;height:38px;object-fit:contain}
h1{font-size:clamp(23px,5vw,30px);margin:0 0 10px}.desc{color:var(--muted);margin:0 0 25px}
.google-btn{width:100%;min-height:52px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#202124;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .18s,box-shadow .18s}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px #0004}.google-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.google-btn:disabled{opacity:.65;cursor:wait;transform:none}
.google-icon{width:20px;height:20px;flex:none}#status{min-height:24px;margin-top:18px;color:var(--muted);overflow-wrap:anywhere;font-size:14px}#status.error{color:#ffb4a9}#status.success{color:var(--accent)}
.foot{margin-top:22px;color:var(--muted);font-size:13px}.foot a{color:var(--accent);text-decoration:none}.back{display:inline-block;margin-top:20px;color:var(--muted);text-decoration:none;font-size:14px}
@media(max-width:360px){body{padding:12px}.card{padding:22px 16px}.brand{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style><link rel="stylesheet" href="global-skeleton.css"><script defer src="global-skeleton.js"></script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAhIvLbAsi7M-TOTBix5q8ihoJ64M_1QU0",authDomain:"lcci-6c2a3.firebaseapp.com",projectId:"lcci-6c2a3",storageBucket:"lcci-6c2a3.firebasestorage.app",messagingSenderId:"486309279972",appId:"1:486309279972:web:bac73946ce8993a41194f1",measurementId:"G-7N85D4CBHY"};
const SHEET_WEB_APP_URL="https://script.google.com/macros/s/AKfycbwTsD9awwQ2bod0EgDdZHs6NGLhNnw_kQ_soWAb5NrVrpXGCWxoRVI_fx-a8NyB7AnHiA/exec";
const auth=getAuth(initializeApp(firebaseConfig)),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const button=document.getElementById("googleBtn"),status=document.getElementById("status");
function show(message,type=""){status.textContent=message;status.className=type}
async function finishLogin(user){
 show("तपाईंको खाता जाँच हुँदैछ…");
 const idToken=await user.getIdToken();
 const response=await fetch(SHEET_WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"logLogin",idToken}),redirect:"follow"});
 if(!response.ok)throw new Error("लगइन विवरण सुरक्षित गर्न सकिएन। केही बेरपछि फेरि प्रयास गर्नुहोस्।");
 const data=await response.json();if(!data.success)throw new Error(data.error||"लगइन विवरण सुरक्षित गर्न सकिएन।");
 show("लगइन सफल भयो। तपाईंको Study पृष्ठ खोलिँदैछ…","success");
 const requested=new URLSearchParams(location.search).get("next");
 const safeTarget=requested&&requested.startsWith("/")&&!requested.startsWith("//")&&!requested.includes("\\")?requested:"/index.html";
 window.location.replace(safeTarget);
}
button.addEventListener("click",async()=>{
 button.disabled=true;show("Google सँग सुरक्षित जडान हुँदैछ…");
 try{
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile){await signInWithRedirect(auth,provider);return;}
  const result=await signInWithPopup(auth,provider);await finishLogin(result.user);
 }catch(error){console.error("NovaFacts sign-in:",error);show(error.code==="auth/unauthorized-domain"?"यो वेबसाइट Firebase मा Authorized domains मा थपिएको छैन। Firebase Console मा novafacts.pages.dev थप्नुहोस्।":error.message||"लगइन हुन सकेन। फेरि प्रयास गर्नुहोस्।","error");button.disabled=false;}
});
try{const result=await getRedirectResult(auth);if(result?.user){button.disabled=true;await finishLogin(result.user);}}catch(error){console.error("NovaFacts redirect sign-in:",error);show(error.message||"Google लगइन पूरा हुन सकेन।","error");button.disabled=false;}
</script></body></html>
