<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";


// Firebase Configuration

const firebaseConfig = {

  apiKey: "AIzaSyAhIvLbAsi7M-TOTBix5q8ihoJ64M_1QU0",

  authDomain: "lcci-6c2a3.firebaseapp.com",

  projectId: "lcci-6c2a3",

  storageBucket: "lcci-6c2a3.firebasestorage.app",

  messagingSenderId: "486309279972",

  appId: "1:486309279972:web:bac73946ce8993a41194f1",

  measurementId: "G-7N85D4CBHY"

};


// Paste your deployed Apps Script URL here

const SHEET_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwTsD9awwQ2bod0EgDdZHs6NGLhNnw_kQ_soWAb5NrVrpXGCWxoRVI_fx-a8NyB7AnHiA/exec";


// Initialize Firebase

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


// Elements

const button = document.getElementById("googleBtn");

const status = document.getElementById("status");



button.addEventListener("click", async () => {
  button.disabled = true;
  status.textContent = "Google Login हुँदैछ...";

  try {
    const result = await signInWithPopup(auth, provider);
    const idToken = await result.user.getIdToken();

    if (SHEET_WEB_APP_URL.includes("PASTE_YOUR")) {
      throw new Error("Apps Script URL राखिएको छैन।");
    }

    status.textContent = "Google Sheet मा विवरण पठाउँदैछ...";

    const response = await fetch(SHEET_WEB_APP_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "logLogin",
        idToken: idToken
      }),
      redirect: "follow"
    });

    const resultData = await response.json();

    if (!resultData.success) {
      throw new Error(resultData.error || "Sheet मा Data लेख्न सकिएन।");
    }

    status.textContent = "Login सफल! Google Sheet मा Data सुरक्षित भयो।";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);

  } catch (error) {
    console.error(error);
    status.textContent = "Error: " + error.message;
    button.disabled = false;
  }
});

</script>
