
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <title>News Details | NovaFacts</title>
  <meta name="description" content="Read available science news details on NovaFacts.">
  <link rel="canonical" href="https://novafacts.pages.dev/news-details.html">

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: #111b2d;
      --text: #edf3ff;
      --muted: #9aaac2;
      --accent: #64b5ff;
      --border: #263650;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 18px 6%;
      border-bottom: 1px solid var(--border);
      background: #0c1423;
    }

    .brand {
      color: var(--text);
      font-size: 23px;
      font-weight: bold;
      text-decoration: none;
    }

    .brand span { color: var(--accent); }

    main {
      width: min(850px, 92%);
      margin: 45px auto;
    }

    .back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 22px;
    }

    article {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(20px, 5vw, 38px);
    }

    .category {
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(27px, 5vw, 40px);
      line-height: 1.25;
      margin: 12px 0;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .news-image {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 12px;
      margin: 10px 0 22px;
    }

    .summary {
      font-size: 18px;
      color: #d5e3f7;
      margin-bottom: 22px;
    }

    .details {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .original {
      display: inline-block;
      margin-top: 25px;
      padding: 11px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #07111f;
      font-weight: bold;
      text-decoration: none;
    }

    #loading, #error {
      color: var(--muted);
      text-align: center;
      padding: 30px 10px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 25px;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>

<header>
  <a class="brand" href="index.html">Nova<span>Facts</span></a>
</header>

<main>
  <a class="back" href="index.html">← Back to NovaFacts</a>

  <p id="loading">Loading news details...</p>
  <p id="error" hidden></p>

  <article id="newsArticle" hidden>
    <div class="category" id="category"></div>

    <h1 id="title"></h1>

    <div class="meta" id="meta"></div>

    <img class="news-image" id="image" alt="" hidden>

    <p class="summary" id="summary"></p>

    <!-- खाली विवरण भाग: विवरण नभए केही देखाइँदैन -->
    <div class="details" id="details"></div>

    <a class="original" id="originalLink"
       target="_blank"
       rel="noopener noreferrer"
       hidden>
      Read Original Source ↗
    </a>
  </article>
</main>

<footer>
  © <span id="year"></span> NovaFacts. All rights reserved.
</footer>

<script>
"use strict";

const params = new URLSearchParams(window.location.search);

const requestedURL = params.get("url") || "";
const requestedTitle = params.get("title") || "";
const requestedCategory = params.get("category") || "Science";

const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const articleBox = document.getElementById("newsArticle");

const titleElement = document.getElementById("title");
const categoryElement = document.getElementById("category");
const metaElement = document.getElementById("meta");
const imageElement = document.getElementById("image");
const summaryElement = document.getElementById("summary");
const detailsElement = document.getElementById("details");
const originalLink = document.getElementById("originalLink");

document.getElementById("year").textContent =
  new Date().getFullYear();

function safeHttpURL(value) {
  try {
    const parsed = new URL(value);
    return ["http:", "https:"].includes(parsed.protocol)
      ? parsed.href
      : "";
  } catch {
    return "";
  }
}

function showError(message) {
  loading.hidden = true;
  errorBox.textContent = message;
  errorBox.hidden = false;
}

function displayNews(news) {
  titleElement.textContent = news.title || "";
  categoryElement.textContent =
    news.category || requestedCategory;

  const date = news.published || news.date || "";
  const source = news.source || "";

  metaElement.textContent = [source, date]
    .filter(Boolean)
    .join(" • ");

  const imageURL = safeHttpURL(news.image || news.image_url || "");

  if (imageURL) {
    imageElement.src = imageURL;
    imageElement.alt = news.title || "News image";
    imageElement.hidden = false;
  }

  summaryElement.textContent = news.summary || "";

  // उपलब्ध विवरण मात्र देखाउने; नभए भाग खाली रहनेछ।
  const fullDetails =
    news.content ||
    news.body ||
    news.fullText ||
    news.full_text ||
    "";

  detailsElement.textContent =
    typeof fullDetails === "string" ? fullDetails : "";

  const publisherURL = safeHttpURL(news.url || requestedURL);

  if (publisherURL) {
    originalLink.href = publisherURL;
    originalLink.hidden = false;
  }

  document.title =
    (news.title || "News Details") + " | NovaFacts";

  loading.hidden = true;
  articleBox.hidden = false;
}

async function loadNewsDetails() {
  if (!requestedURL && !requestedTitle) {
    showError("No news article was selected.");
    return;
  }

  try {
    const response = await fetch(
      "./news.json?updated=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Could not load news.json.");
    }

    const data = await response.json();

    const articles = Array.isArray(data.articles)
      ? data.articles
      : [];

    const selected = articles.find(item =>
      requestedURL &&
      item.url === requestedURL
    ) || articles.find(item =>
      requestedTitle &&
      item.title === requestedTitle
    );

    if (!selected) {
      showError("This news article is no longer available.");
      return;
    }

    displayNews(selected);

  } catch (error) {
    console.error("NovaFacts detail error:", error);
    showError("Unable to load this news article. Please try again later.");
  }
}

loadNewsDetails();
</script>

</body>
</html>
